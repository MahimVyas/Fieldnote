name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect static assets
        run: |
          mkdir -p dist && cp index.html style.css script.js favicon.svg dist/
          TAG="${GITHUB_SHA:0:7}"
          sed -i "s|href=\"style.css\"|href=\"style.css?v=${TAG}\"|; s|src=\"script.js\"|src=\"script.js?v=${TAG}\"|; s|href=\"favicon.svg\"|href=\"favicon.svg?v=${TAG}\"|" dist/index.html
          grep -o 'style.css?v=[0-9a-f]*\|script.js?v=[0-9a-f]*\|favicon.svg?v=[0-9a-f]*' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
